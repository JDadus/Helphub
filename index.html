<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HelpHub</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Segoe UI,sans-serif;
    background:linear-gradient(135deg,#080b14,#151b32,#211333);
    color:white;
    min-height:100vh;
}

button,input,select,textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none !important;
}

.nav{
    height:70px;
    padding:0 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#080b14ee;
    border-bottom:1px solid #ffffff20;
    position:sticky;
    top:0;
    z-index:10;
}

.logo{
    font-size:26px;
    font-weight:bold;
}

.logo span{
    color:#818cf8;
}

.nav-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.container{
    max-width:1150px;
    margin:auto;
    padding:25px;
}

.hero{
    text-align:center;
    padding:55px 10px 30px;
}

.hero h1{
    font-size:65px;
    margin:15px 0;
    background:linear-gradient(90deg,#fff,#a5b4fc,#c4b5fd);
    color:transparent;
    background-clip:text;
}

.hero p{
    color:#94a3b8;
    font-size:18px;
    line-height:1.6;
    max-width:700px;
    margin:auto;
}

.badge{
    display:inline-block;
    padding:6px 12px;
    border-radius:30px;
    background:#1e293b;
    border:1px solid #475569;
    color:#c7d2fe;
    font-size:12px;
    font-weight:bold;
}

.auth-box{
    max-width:450px;
    margin:35px auto;
    padding:25px;
    background:#111827ee;
    border:1px solid #ffffff20;
    border-radius:20px;
    box-shadow:0 20px 60px #0006;
}

.tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:5px;
    background:#0b1220;
    padding:5px;
    border-radius:12px;
    margin-bottom:20px;
}

.tab{
    border:0;
    padding:12px;
    border-radius:9px;
    background:transparent;
    color:#94a3b8;
    font-weight:bold;
}

.tab.active{
    background:#303958;
    color:white;
}

.form-group{
    margin:14px 0;
    text-align:left;
}

.form-group label{
    display:block;
    margin-bottom:6px;
    color:#cbd5e1;
    font-size:13px;
    font-weight:bold;
}

input,select,textarea{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #ffffff20;
    background:#0b1220;
    color:white;
    outline:none;
}

textarea{
    min-height:100px;
    resize:vertical;
}

input:focus,
select:focus,
textarea:focus{

}

.btn{
    border:0;
    padding:10px 16px;
    border-radius:10px;
    font-weight:bold;
    transition:.2s;
}

.btn:hover{
    transform:translateY(-2px);
}

.primary{
    background:linear-gradient(135deg,#6366f1,#8b5cf6);
    color:white;
}

.dark{
    background:#20293a;
    color:white;
    border:1px solid #ffffff20;
}

.danger{
    background:#451a1f;
    color:#fecaca;
}

.success{
    background:#12351f;
    color:#bbf7d0;
}

.warning{
    background:#3b2b0c;
    color:#fde68a;
}

.full{
    width:100%;
}

.heading{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:20px 0;
}

.heading h2{
    margin:7px 0;
    font-size:30px;
}

.stats{

}

.stat{
    background:#111827e8;

}

.stat small{

}

.stat strong{

    margin-top:7px;

.grid{

.card{

.card h3{

.mode-grid{

.mode-card{

.mode-card:hover{

.mode-icon{

.mode-card p{

.request{

.request-top{

}

.request h4{

}

.meta{

    line-height:1.7;

.description{

    line-height:1.5;

.status{

    border-radius:20px;

    font-weight:bold;
}

.open{

}

.assigned{
    background:#3b2b0c;
    color:#fde68a;
}

.completed{

    color:#bbf7d0;
}

.blocked{

    color:#fecaca;
}

.active{

    color:#bbf7d0;
}

.actions{

    gap:7px;

    margin-top:10px;
}

.empty{
    text-align:center;
    color:#64748b;
    padding:25px;
}

.table-container{
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:12px;
    border-bottom:1px solid #ffffff17;
    text-align:left;
    font-size:13px;

th{

}

.modal{
    position:fixed;
    inset:0;
    background:#000b;
    display:flex;

    align-items:center;
    padding:20px;

}

.modal-box{

    background:#111827;

    border-radius:20px;

}

.modal-head{

    align-items:center;
}

.info-grid{

.info b{

.chat-box{

.messages{

.message{

.send-box{

    }

const firebaseConfig = {

    apiKey:
    "AIzaSyAGSX7VLwTK3hdnm2dEURCMG8YchDE8XTE",

    "travel-81ab4.firebaseapp.com",

    databaseURL:
    "https://travel-81ab4-default-rtdb.firebaseio.com",

    projectId:
    "travel-81ab4",

    storageBucket:
    "travel-81ab4.firebasestorage.app",

    messagingSenderId:
    "978469309246",

    appId:
    "1:978469309246:web:2cee2175426d4a91063a6f",

    measurementId:
    "G-T0GBMSE60Z"
};


const firebaseApp =

const auth =
    getAuth(firebaseApp);

const db =

/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let currentUser = null;
let profile = null;
let listeners = [];


/* =====================================================
   HELPERS
===================================================== */

const $ = id =>
    document.getElementById(id);


function escapeHTML(value){

    return String(value ?? "")
        .replace(/[&<>"']/g, character => ({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"
        }[character]));

}


function dateFormat(value){

    if(!value) return "—";

    return new Date(value)
        .toLocaleString();

}


function clearListeners(){

    listeners.forEach(
        unsubscribe => {

            if(typeof unsubscribe === "function"){
                unsubscribe();
            }

        }
    );

    listeners = [];

}


/* =====================================================
   NAVBAR
===================================================== */

function navbar(){

    `;

}


/* =====================================================
   LOGIN PAGE
===================================================== */

function landing(){

/* =====================================================
   LOGIN FORM
===================================================== */

function showLoginForm(){

/* =====================================================
   REGISTER FORM
===================================================== */

function showRegisterForm(){

    $("registerTab").classList.add("active");
    $("loginTab").classList.remove("active");


    $("authForm").innerHTML = `

}


/* =====================================================
   USER LOGIN
===================================================== */

async function loginUser(){

    try{

        const email =
            $("email").value.trim();

        const password =
            $("password").value;


        if(!email || !password){

            alert(
                "Enter email and password."
            );

            return;
        }


        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

    }
    catch(error){

        alert(error.message);

    }

}


/* =====================================================
   ADMIN LOGIN
===================================================== */

async function loginAdmin(){

    try{

        const email =
            $("email").value.trim();

        const password =
            $("password").value;


        if(!email || !password){

            alert(
                "Enter admin email and password."
            );

            return;
        }


        const result =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


        const snapshot =
            await get(
                ref(
                    db,
                    "users/" +
                    result.user.uid
                )
            );


        if(!snapshot.exists()){

            alert(
                "Admin profile not found."
            );

            await signOut(auth);

            return;
        }


        const data =
            snapshot.val();


        if(data.role !== "admin"){

            alert(
                "This account is not an Admin account."
            );

            await signOut(auth);

            return;
        }


        if(data.status === "blocked"){

            alert(
                "Admin account is blocked."
            );

            await signOut(auth);

            return;
        }


        profile = data;


        adminDashboard();

    }
    catch(error){

        alert(error.message);

    }

}


/* =====================================================
   REGISTER
===================================================== */

async function registerUser(){

    try{

        const name =
            $("name").value.trim();

        const phone =
            $("phone").value.trim();

        const email =
            $("email").value.trim();

        const password =
            $("password").value;


        if(!name){

            alert(
                "Enter your name."
            );

            return;
        }


        if(password.length < 6){

            alert(
                "Password must have at least 6 characters."
            );

            return;
        }


        const result =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        await set(
            ref(
                db,
                "users/" +
                result.user.uid
            ),
            {

                uid:
                    result.user.uid,

                name:
                    name,

                phone:
                    phone,

                email:
                    email,

                role:
                    "member",

                mode:
                    "help",

                status:
                    "active",

                createdAt:
                    Date.now()

            }
        );


        alert(
            "Account created successfully!"
        );

    }
    catch(error){

        alert(error.message);

    }

}


/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(
    auth,
    async user => {

        currentUser = user;


        if(!user){

            profile = null;

            landing();

            return;
        }


        try{

            const snapshot =
                await get(
                    ref(
                        db,
                        "users/" +
                        user.uid
                    )
                );


            if(!snapshot.exists()){

                await set(
                    ref(
                        db,
                        "users/" +
                        user.uid
                    ),
                    {

                        uid:
                            user.uid,

                        name:
                            user.email
                            .split("@")[0],

                        email:
                            user.email,

                        role:
                            "member",

                        mode:
                            "help",

                        status:
                            "active",

                        createdAt:
                            Date.now()

                    }
                );

            }


            const updatedSnapshot =
                await get(
                    ref(
                        db,
                        "users/" +
                        user.uid
                    )
                );


            profile =
                updatedSnapshot.val();


            if(profile.status === "blocked"){

                alert(
                    "Your account has been blocked by Admin."
                );

                await signOut(auth);

                return;
            }


            showDashboard();

        }
        catch(error){

            alert(error.message);

        }

    }
);


/* =====================================================
   DASHBOARD ROUTER
===================================================== */

function showDashboard(){

    if(profile.role === "admin"){

        adminDashboard();

    }
    else if(profile.mode === "volunteer"){

        volunteerDashboard();

    }
    else{

        helpDashboard();

    }

}

/* =====================================================
   CHANGE MODE
===================================================== */

async function changeMode(mode){

    try{

        await update(
            ref(
                db,
                "users/" +
                currentUser.uid
            ),
            {
                mode:mode
            }
        );


        profile.mode = mode;

        showDashboard();

    }
    catch(error){

        alert(error.message);

    }

}

async function createHelpRequest(){

    try{

        const title =
            $("requestTitle")
            .value
            .trim();

        const description =
            $("requestDescription")
            .value
            .trim();

        const location =
            $("requestLocation")
            .value
            .trim();


        if(!title ||
           !description ||
           !location){

            alert(
                "Please fill all required fields."
            );

            return;
        }


        const id =
            push(
                ref(db,"helpRequests")
            ).key;


        await set(
            ref(
                db,
                "helpRequests/" +
                id
            ),
            {

                requestId:
                    id,

                title:
                    title,

                description:
                    description,

                category:
                    $("requestCategory").value,

                location:
                    location,

                urgency:
                    $("requestUrgency").value,

                createdBy:
                    currentUser.uid,

                requesterName:
                    profile.name,

                status:
                    "open",

                volunteerId:
                    "",

                volunteerName:
                    "",

                createdAt:
                    Date.now()

            }
        );


        $("requestTitle").value="";
        $("requestDescription").value="";
        $("requestLocation").value="";


        alert(
            "Help request created!"
        );

    }
    catch(error){

        alert(error.message);

    }

}


/* =====================================================
   HELP REQUEST LISTENER
===================================================== */

function listenHelpRequests(){

    const unsubscribe =
        onValue(
            ref(db,"helpRequests"),
            snapshot => {

                const data =
                    snapshot.val() || {};


                const requests =
                    Object.values(data)
                    .filter(
                        r =>
                        r.createdBy ===
                        currentUser.uid
                    )
                    .sort(
                        (a,b)=>
                        (b.createdAt||0) -
                        (a.createdAt||0)
                    );


                $("requestCount")
                    .textContent =
                    requests.length;


                $("assignedCount")
                    .textContent =
                    requests.filter(
                        r =>
                        r.status === "assigned"
                    ).length;


                $("completedCount")
                    .textContent =
                    requests.filter(
                        r =>
                        r.status === "completed"
                    ).length;


                $("myRequests").innerHTML =
                    requests.length
                    ?

                    requests
                    .map(
                        createRequestHTML
                    )
                    .join("")

                    :

                    `
                    <div class="empty">
                        No requests yet.
                    </div>
                    `;


                requests.forEach(
                    r =>
                    loadOffers(
                        r.requestId
                    )
                );


                bindButtons();

            }
        );


    listeners.push(
        unsubscribe
    );

}

/* =====================================================
   LOAD OFFERS
===================================================== */

async function loadOffers(requestId){

    try{

        const requestSnapshot =
            await get(
                ref(
                    db,
                    "helpRequests/" +
                    requestId
                )
            );


        const request =
            requestSnapshot.val();


        if(
            !request ||
            request.createdBy !==
            currentUser.uid
        ){

            return;
        }


        const snapshot =
            await get(
                ref(
                    db,
                    "offers/" +
                    requestId
                )
            );


        const offers =
            snapshot.val() || {};


        const list =
            Object.entries(offers);


        if(!$("offers")) return;


        $("offers").innerHTML =
            list.length

            ?

            list
            .map(
                ([id,o]) => `

                <div class="request">

                    <div class="request-top">

                        <h4>

                            🙋
                            ${escapeHTML(
                                o.volunteerName
                            )}

                        </h4>


                        <span class="status open">

                            ${escapeHTML(
                                o.status ||
                                "pending"
                            )}

                        </span>

                    </div>


                    <div class="description">

                        ${escapeHTML(
                            o.message ||
                            "I can help."
                        )}

                    </div>


                    <div class="actions">

                        ${
                            !request.volunteerId &&
                            o.status !== "rejected"

                            ?

                            `
                            <button
                                class="btn success"
                                data-accept="${requestId}|${id}">

                                Accept Volunteer

                            </button>
                            `

                            :

                            ""
                        }


                        ${
                            request.volunteerId === id

                            ?

                            `
                            <button
                                class="btn primary"
                                data-chat="${requestId}">

                                💬 Chat

                            </button>
                            `

                            :

                            ""
                        }

                    </div>

                </div>

                `
            )
            .join("")

            :

            `
            <div class="empty">
                No volunteer offers yet.
            </div>
            `;


        bindButtons();

    }
    catch(error){

        console.log(error);

    }

}


/* =====================================================
   ACCEPT VOLUNTEER
===================================================== */

async function acceptVolunteer(
    requestId,
    volunteerId
){

    try{

        const snapshot =
            await get(
                ref(
                    db,
                    "offers/" +
                    requestId +
                    "/" +
                    volunteerId
                )
            );


        const offer =
            snapshot.val();


        if(!offer) return;


        await update(
            ref(
                db,
                "helpRequests/" +
                requestId
            ),
            {

                status:
                    "assigned",

                volunteerId:
                    volunteerId,

                volunteerName:
                    offer.volunteerName

            }
        );


        await update(
            ref(
                db,
                "offers/" +
                requestId +
                "/" +
                volunteerId
            ),
            {
                status:
                    "accepted"
            }
        );


        const allOffers =
            (
                await get(
                    ref(
                        db,
                        "offers/" +
                        requestId
                    )
                )
            ).val() || {};


        for(
            const id of
            Object.keys(allOffers)
        ){

            if(id !== volunteerId){

                await update(
                    ref(
                        db,
                        "offers/" +
                        requestId +
                        "/" +
                        id
                    ),
                    {
                        status:
                            "rejected"
                    }
                );

            }

        }


        alert(
            "Volunteer accepted!"
        );

    }
    catch(error){

        alert(error.message);

    }

}

   CHAT
===================================================== */

function openChat(
    requestId,
    volunteer = false
){

    const section =
        volunteer
        ?
        $("volunteerChat")
        :
        $("chatSection");


    const container =
        volunteer
        ?
        $("volunteerChatContainer")
        :
        $("chatContainer");


    if(!section || !container)
        return;


    section.classList.remove(
        "hidden"
    );


    container.innerHTML = `

        <div class="chat-box">

            <div
                class="messages"
                id="messages">

            </div>


            <div class="send-box">

                <input
                    id="messageInput"
                    placeholder="Type message...">

                <button
                    class="btn primary"
                    id="sendBtn">

                    Send

                </button>

            </div>

        </div>

    `;


    $("sendBtn").onclick =
        () =>
        sendMessage(requestId);


    $("messageInput").onkeydown =
        event => {

            if(event.key === "Enter"){

                sendMessage(
                    requestId
                );

            }

        };


    const unsubscribe =
        onValue(
            ref(
                db,
                "chats/" +
                requestId
            ),
            snapshot => {

                const messages =
                    Object.values(
                        snapshot.val() || {}
                    )
                    .sort(
                        (a,b) =>
                        (a.timestamp || 0) -
                        (b.timestamp || 0)
                    );


                $("messages").innerHTML =
                    messages.length

                    ?

                    messages.map(
                        m => `

                        <div class="message ${
                            m.senderId ===
                            currentUser.uid
                            ?
                            "mine"
                            :
                            ""
                        }">

                            <b>
                                ${escapeHTML(
                                    m.senderName
                                )}
                            </b>

                            <div>
                                ${escapeHTML(
                                    m.message
                                )}
                            </div>

                            <small>
                                ${dateFormat(
                                    m.timestamp
                                )}
                            </small>

                        </div>

                        `
                    ).join("")

                    :

                    `
                    <div class="empty">
                        Start chatting.
                    </div>
                    `;


                $("messages").scrollTop =
                    $("messages").scrollHeight;

            }
        );


    listeners.push(
        unsubscribe
    );

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(requestId){

    const input =
        $("messageInput");


    const message =
        input.value.trim();


    if(!message)
        return;


    try{

        const id =
            push(
                ref(
                    db,
                    "chats/" +
                    requestId
                )
            ).key;


        await set(
            ref(
                db,
                "chats/" +
                requestId +
                "/" +
                id
            ),
            {

                senderId:
                    currentUser.uid,

                senderName:
                    profile.name,

                message:
                    message,

                timestamp:
                    Date.now()

            }
        );


        input.value = "";

    }
    catch(error){

        alert(error.message);

    }

}

    listeners.push(
        userListener,
        requestListener
    );

}


/* =====================================================

===================================================== */

async function viewUser(uid){

    try{

        const userSnapshot =
            await get(
                ref(
                    db,
                    "users/" +
                    uid
                )
            );


        if(!userSnapshot.exists()){

            alert(
                "User not found."
            );

            return;
        }


        const user =
            userSnapshot.val();


        const requestSnapshot =
            await get(
                ref(
                    db,
                    "helpRequests"
                )
            );


        const requests =
            Object.values(
                requestSnapshot.val() || {}
            );


        /* REQUESTS CREATED */

        const created =
            requests.filter(
                r =>
                r.createdBy === uid
            );


        /* VOLUNTEER TASKS */

        const tasks =
            requests.filter(
                r =>
                r.volunteerId === uid
            );


        /* OFFERS */

        const offersSnapshot =
            await get(
                ref(
                    db,
                    "offers"
                )
            );


        const offerRoot =
            offersSnapshot.val() || {};


        let totalOffers = 0;
        let acceptedOffers = 0;


        Object.values(
            offerRoot
        ).forEach(
            group => {

                Object.values(
                    group || {}
                ).forEach(
                    offer => {

                        if(
                            offer.volunteerId === uid
                        ){

                            totalOffers++;

                            if(

                    </div>

                        Mode

                            ${escapeHTML(
                                user.mode ||
                                "help"
                            )}
                        </b>

                    </div>


                    <div class="info">

                        Status

                        <b>
                            ${escapeHTML(
                                user.status ||
                                "active"
                            )}
                        </b>

                    </div>


                    <div class="info">

                        Requests

                        <b>
                            ${created.length}
                        </b>

                    </div>


                    <div class="info">

                        Volunteer Tasks

                        <b>
                            ${tasks.length}
                        </b>

                    </div>


                    <div class="info">

                        <b>

                        </b>

                    </div>

                </div>


                <!-- DETAILS -->

                <div class="card">

                    <h3>
                        👤 Account Details
                    </h3>

                    <div class="meta">

                        <b>Name:</b>
                        ${escapeHTML(
                            user.name
                        )}

                        <br><br>

                        <b>Email:</b>
                        ${escapeHTML(
                            user.email
                        )}

                        <br><br>

                        <b>Phone:</b>

                        )}

                        <br><br>

                        <b>Role:</b>
                        ${escapeHTML(

                        )}

                        <br><br>

                        <b>Current Mode:</b>

                <div class="card">

/* =====================================================
   ADMIN BLOCK / UNBLOCK
===================================================== */

async function toggleUser(uid){

    try{

        const snapshot =
            await get(
                ref(
                    db,
                    "users/" +
                    uid
                )
            );
        const user =
            snapshot.val();
        const status =
            user.status === "blocked"
            ?
            "active"
            :
            "blocked";


        await update(
            ref(
                db,
                "users/" +
                uid
            ),
            {
                status:
                    status
            }
        );


    }
    catch(error){

        alert(error.message);

    }

}


/* =====================================================
   ADMIN DELETE REQUEST
===================================================== */

async function adminDeleteRequest(id){

    if(
        !confirm(
            "Delete this help request?"
        )
    ){

        return;

    }


    try{

        await remove(
            ref(
                db,
                "helpRequests/" +
                id
            )
        );


        alert(
            "Request deleted."
        );

    }
    catch(error){

        alert(error.message);

    }

}


/* =====================================================
   BUTTON BINDING
===================================================== */

function bindButtons(){
    document
    .querySelectorAll(
        "[data-accept]"
    )
    .forEach(
        button => {

            button.onclick =
                () => {

                    const [
                        requestId,
                        volunteerId
                    ] =
                    button
                    .dataset
                    .accept
                    .split("|");
                    acceptVolunteer(
                        requestId,
                        volunteerId
                    );
                };
        }
    );
    document
    .querySelectorAll(
        "[data-chat]"
    )
    .forEach(
        button => {

            button.onclick =
                () =>
                openChat(
                    button.dataset.chat
                );

        }
    );
    document
    .querySelectorAll(
        "[data-volchat]"
    )
    .forEach(
        button => {
            button.onclick =
                () =>
                openChat(
                    button.dataset.volchat,
                    true
                );
        }
    );
    document
    .querySelectorAll(
        "[data-complete]"
    )
    .forEach(
        button => {

            button.onclick =
                () =>
                completeRequest(
                    button.dataset.complete
                );
        }
    );
    document
    .querySelectorAll(
        "[data-offer]"
    )
    .forEach(
        button => {
            button.onclick =
                () =>
                offerHelp(
                    button.dataset.offer
                );
        }
    );
    document
    .querySelectorAll(
        "[data-viewuser]"
    )
    .forEach(
        button => {

            button.onclick =
                () =>
                viewUser(
                    button.dataset.viewuser
                );
        }
    );
    document
    .querySelectorAll(
        "[data-blockuser]"
    )
    .forEach(
        button => {

            button.onclick =
                () =>
                toggleUser(
                    button.dataset.blockuser
                );

        }
    );
    document
    .querySelectorAll(
        "[data-deleterequest]"
    )
    .forEach(
        button => {
            button.onclick =
                () =>
                adminDeleteRequest(
                    button.dataset.deleterequest
              );
        }
    );
}
