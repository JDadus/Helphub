<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HelpHub - Community Help Platform</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#080b14,#151b32,#211333);color:#f8fafc;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.nav{height:70px;padding:0 28px;display:flex;justify-content:space-between;align-items:center;background:#080b14e8;border-bottom:1px solid #ffffff1c;position:sticky;top:0;z-index:10;backdrop-filter:blur(15px)}.logo{font-size:25px;font-weight:900}.logo span{color:#818cf8}.navright{display:flex;gap:8px;align-items:center}.wrap{max-width:1150px;margin:auto;padding:25px}.hero{text-align:center;padding:60px 10px 35px}.hero h1{font-size:65px;margin:12px 0;background:linear-gradient(90deg,#fff,#a5b4fc,#c4b5fd);color:transparent;background-clip:text}.hero p{max-width:700px;margin:auto;color:#94a3b8;font-size:18px;line-height:1.7}.badge{display:inline-block;background:#1e293b;border:1px solid #475569;padding:5px 10px;border-radius:30px;font-size:12px;color:#c7d2fe;font-weight:700}.auth{max-width:450px;margin:30px auto;background:#111827ee;border:1px solid #ffffff1c;border-radius:22px;padding:25px;box-shadow:0 20px 60px #0005}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#0b1220;padding:4px;border-radius:12px;margin-bottom:18px}.tab{border:0;background:transparent;color:#94a3b8;padding:11px;border-radius:9px;font-weight:700}.tab.active{background:#303958;color:#fff}.group{margin:13px 0;text-align:left}.group label{display:block;font-size:13px;font-weight:700;color:#cbd5e1;margin-bottom:6px}input,select,textarea{width:100%;padding:12px;border-radius:11px;border:1px solid #ffffff1c;background:#0b1220;color:#fff;outline:none}textarea{min-height:100px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:#6366f1;box-shadow:0 0 0 3px #6366f122}.btn{border:0;border-radius:11px;padding:10px 15px;font-weight:800;transition:.2s}.btn:hover{transform:translateY(-2px)}.primary{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white}.dark{background:#20293a;color:white;border:1px solid #ffffff1c}.danger{background:#40171d;color:#fecaca;border:1px solid #7f1d1d}.success{background:#12351f;color:#bbf7d0;border:1px solid #166534}.full{width:100%}.head{display:flex;justify-content:space-between;align-items:center;margin:20px 0;gap:15px}.head h2{margin:6px 0;font-size:30px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat,.card{background:#111827e8;border:1px solid #ffffff1c;border-radius:18px;padding:19px}.stat small{color:#94a3b8}.stat strong{display:block;font-size:30px;margin-top:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.card{margin-bottom:18px}.card h3{margin-top:0}.modegrid{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:900px;margin:30px auto}.mode{padding:30px;border:1px solid #ffffff1c;border-radius:20px;background:linear-gradient(145deg,#121a2b,#0e1421);transition:.25s}.mode:hover{transform:translateY(-5px);border-color:#6366f1}.icon{font-size:42px}.mode p,.muted{color:#94a3b8;line-height:1.6}.request{padding:15px;border:1px solid #ffffff1a;border-radius:14px;background:#0d1422;margin:11px 0}.rhead{display:flex;justify-content:space-between;gap:8px}.request h4{margin:0 0 6px;font-size:17px}.meta{font-size:12px;color:#94a3b8;line-height:1.7}.desc{margin:9px 0;color:#dbeafe;line-height:1.5}.status{padding:4px 8px;border-radius:20px;font-size:10px;font-weight:900;height:max-content}.open{background:#172554;color:#bfdbfe}.assigned{background:#3b2b0c;color:#fde68a}.completed{background:#12351f;color:#bbf7d0}.cancelled{background:#3a171d;color:#fecaca}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.chat{height:390px;display:flex;flex-direction:column}.messages{flex:1;overflow:auto;background:#080d18;border-radius:12px;padding:10px;margin-bottom:9px}.msg{max-width:78%;background:#1b263a;padding:9px 11px;border-radius:14px;margin:7px 0}.mine{margin-left:auto;background:#4338ca}.msg small{display:block;font-size:9px;color:#cbd5e1;margin-top:4px}.send{display:flex;gap:7px}.send input{flex:1}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid #ffffff17;text-align:left;font-size:12px}.table th{color:#c7d2fe}.empty{text-align:center;color:#64748b;padding:25px}.footer{text-align:center;color:#64748b;padding:30px}@media(max-width:800px){.grid,.modegrid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.nav{padding:0 14px}.wrap{padding:15px}}@media(max-width:500px){.stats{grid-template-columns:1fr}.hero h1{font-size:48px}.head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body><div id="app"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import{getDatabase,ref,set,get,push,update,remove,onValue}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyAGSX7VLwTK3hdnm2dEURCMG8YchDE8XTE",authDomain:"travel-81ab4.firebaseapp.com",databaseURL:"https://travel-81ab4-default-rtdb.firebaseio.com",projectId:"travel-81ab4",storageBucket:"travel-81ab4.firebasestorage.app",messagingSenderId:"978469309246",appId:"1:978469309246:web:2cee2175426d4a91063a6f",measurementId:"G-T0GBMSE60Z"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);let user=null,profile=null,offs=[];const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),time=x=>x?new Date(x).toLocaleString():'—';function clear(){offs.forEach(x=>x&&x());offs=[]}
function nav(){return`<nav class="nav"><div class="logo">Help<span>Hub</span> 🤝</div><div class="navright">${profile?`<span class="badge">${esc(profile.name)} · ${profile.role==='admin'?'Admin':profile.mode==='volunteer'?'Volunteer':'Member'}</span><button class="btn dark" id="account">Account</button><button class="btn danger" id="logout">Logout</button>`:''}</div></nav>`}
function landing(){clear();$('app').innerHTML=nav()+`<main class="wrap"><section class="hero"><span class="badge">COMMUNITY • HELP • VOLUNTEER</span><h1>HelpHub</h1><p>Connect people who need help with people who are ready to help — with real-time requests, offers and chat.</p><div class="auth"><div class="tabs"><button class="tab active" id="lt">Login</button><button class="tab" id="rt">Register</button></div><div id="af"></div></div></section><div class="footer">HelpHub • B.Sc IT CA-2 Project</div></main>`;loginForm();$('lt').onclick=loginForm;$('rt').onclick=registerForm}
function loginForm(){$('lt').classList.add('active');$('rt').classList.remove('active');$('af').innerHTML=`<div class="group"><label>Email</label><input id="email" type="email" placeholder="you@example.com"></div><div class="group"><label>Password</label><input id="pass" type="password"></div><button class="btn primary full" id="auth">Login</button>`;$('auth').onclick=authLogin}
function registerForm(){$('rt').classList.add('active');$('lt').classList.remove('active');$('af').innerHTML=`<div class="group"><label>Name</label><input id="name" placeholder="Your name"></div><div class="group"><label>Phone</label><input id="phone" placeholder="Mobile"></div><div class="group"><label>Email</label><input id="email" type="email"></div><div class="group"><label>Password</label><input id="pass" type="password" placeholder="Minimum 6 characters"></div><button class="btn primary full" id="auth">Create Account</button>`;$('auth').onclick=authRegister}
async function authLogin(){try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('pass').value)}catch(e){alert(e.message)}}
async function authRegister(){try{let n=$('name').value.trim(),p=$('phone').value.trim(),e=$('email').value.trim();if(!n)return alert('Enter your name');let c=await createUserWithEmailAndPassword(auth,e,$('pass').value);await set(ref(db,'users/'+c.user.uid),{uid:c.user.uid,name:n,phone:p,email:e,role:'member',mode:'help',status:'active',createdAt:Date.now()})}catch(e){alert(e.message)}}
onAuthStateChanged(auth,async u=>{user=u;if(!u){profile=null;landing();return}let s=await get(ref(db,'users/'+u.uid));if(!s.exists())await set(ref(db,'users/'+u.uid),{uid:u.uid,name:u.email.split('@')[0],email:u.email,role:'member',mode:'help',status:'active',createdAt:Date.now()});profile=(await get(ref(db,'users/'+u.uid))).val();if(profile.status==='blocked'){alert('Your account is blocked by admin.');return signOut(auth)}show()});
$('app').addEventListener('click',e=>{if(e.target.id==='logout')signOut(auth);if(e.target.id==='account')account()});
function account(){clear();$('app').innerHTML=nav()+`<main class="wrap"><div class="head"><div><span class="badge">ACCOUNT</span><h2>Choose Your Mode</h2></div><button class="btn dark" id="back">← Dashboard</button></div><div class="modegrid"><div class="mode"><div class="icon">🆘</div><h2>I Want Help</h2><p>Create a help request and accept a volunteer.</p><button class="btn primary full" id="hm">Use Help Mode</button></div><div class="mode"><div class="icon">🙋</div><h2>I Want to Help</h2><p>Find open requests and offer your help.</p><button class="btn primary full" id="vm">Use Volunteer Mode</button></div></div></main>`;$('back').onclick=show;$('hm').onclick=()=>mode('help');$('vm').onclick=()=>mode('volunteer')}
async function mode(m){await update(ref(db,'users/'+user.uid),{mode:m});profile.mode=m;show()}
function show(){profile.role==='admin'?admin():profile.mode==='volunteer'?volunteer():help()}
function help(){clear();$('app').innerHTML=nav()+`<main class="wrap"><div class="head"><div><span class="badge">HELP MODE</span><h2>Need Help?</h2></div></div><div class="stats"><div class="stat"><small>My Requests</small><strong id="c1">0</strong></div><div class="stat"><small>Assigned</small><strong id="c2">0</strong></div><div class="stat"><small>Completed</small><strong id="c3">0</strong></div><div class="stat"><small>Current Mode</small><strong style="font-size:18px">HELP</strong></div></div><div class="grid"><section class="card"><h3>📝 Create Request</h3><div class="group"><label>Title</label><input id="title" placeholder="Need help with..."></div><div class="group"><label>Category</label><select id="cat"><option>General</option><option>Education</option><option>Food</option><option>Transport</option><option>Technology</option><option>Senior Citizen</option><option>Medical Support</option><option>Other</option></select></div><div class="group"><label>Description</label><textarea id="desc"></textarea></div><div class="group"><label>Location</label><input id="loc"></div><div class="group"><label>Urgency</label><select id="urg"><option>Normal</option><option>High</option><option>Urgent</option></select></div><button class="btn primary full" id="post">Post Help Request</button></section><section class="card"><h3>📋 My Requests</h3><div id="mine"><div class="empty">Loading...</div></div></section></div><section class="card"><h3>🤝 Volunteer Offers</h3><div id="offers"><div class="empty">Offers appear here in real time.</div></div></section><section class="card hidden" id="chat"><h3>💬 Chat</h3><div id="chatbox"></div></section></main>`;$('post').onclick=post;listenHelp()}
async function post(){let t=$('title').value.trim(),d=$('desc').value.trim(),l=$('loc').value.trim();if(!t||!d||!l)return alert('Fill all required fields.');let id=push(ref(db,'helpRequests')).key;await set(ref(db,'helpRequests/'+id),{requestId:id,title:t,description:d,category:$('cat').value,location:l,urgency:$('urg').value,createdBy:user.uid,requesterName:profile.name,status:'open',volunteerId:'',volunteerName:'',createdAt:Date.now()});$('title').value=$('desc').value=$('loc').value='';alert('Request posted!')}
function listenHelp(){let off=onValue(ref(db,'helpRequests'),async s=>{let a=Object.values(s.val()||{}).filter(x=>x.createdBy===user.uid).sort((a,b)=>b.createdAt-a.createdAt);$('c1').textContent=a.length;$('c2').textContent=a.filter(x=>x.status==='assigned').length;$('c3').textContent=a.filter(x=>x.status==='completed').length;$('mine').innerHTML=a.length?a.map(card).join(''):'<div class="empty">No requests yet.</div>';a.forEach(r=>offers(r.requestId));bindButtons()});offs.push(off)}
function card(r){return`<div class="request"><div class="rhead"><div><h4>${esc(r.title)}</h4><div class="meta">${esc(r.category)} • ${esc(r.location)} • ${esc(r.urgency)} • ${time(r.createdAt)}</div></div><span class="status ${r.status}">${esc(r.status)}</span></div><div class="desc">${esc(r.description)}</div>${r.volunteerName?`<div class="meta">Volunteer: <b>${esc(r.volunteerName)}</b></div>`:''}<div class="actions">${r.status==='assigned'?`<button class="btn primary" data-chat="${r.requestId}">Chat</button><button class="btn success" data-done="${r.requestId}">Completed</button>`:''}</div></div>`}
async function offers(id){let o=(await get(ref(db,'offers/'+id))).val()||{},r=(await get(ref(db,'helpRequests/'+id))).val();if(!r||r.createdBy!==user.uid)return;let arr=Object.entries(o);let el=$('offers');if(!el)return;el.innerHTML=arr.length?arr.map(([vid,x])=>`<div class="request"><div class="rhead"><h4>🙋 ${esc(x.volunteerName)}</h4><span class="status ${x.status==='accepted'?'assigned':'open'}">${esc(x.status||'pending')}</span></div><div class="desc">${esc(x.message)}</div><div class="actions">${!r.volunteerId&&x.status!=='rejected'?`<button class="btn success" data-accept="${id}|${vid}">Accept</button>`:''}${r.volunteerId===vid?`<button class="btn primary" data-chat="${id}">Chat</button>`:''}</div></div>`).join(''):'<div class="empty">No volunteer offers yet.</div>';bindButtons()}
async function accept(id,vid){let o=(await get(ref(db,'offers/'+id+'/'+vid))).val();if(!o)return;await update(ref(db,'helpRequests/'+id),{status:'assigned',volunteerId:vid,volunteerName:o.volunteerName});await update(ref(db,'offers/'+id+'/'+vid),{status:'accepted'});let all=(await get(ref(db,'offers/'+id))).val()||{};for(let x in all)if(x!==vid)await update(ref(db,'offers/'+id+'/'+x),{status:'rejected'});alert('Volunteer accepted!')}
async function done(id){await update(ref(db,'helpRequests/'+id),{status:'completed',completedAt:Date.now()})}
function bindButtons(){document.querySelectorAll('[data-accept]').forEach(b=>b.onclick=()=>{let[a,c]=b.dataset.accept.split('|');accept(a,c)});document.querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>chat(b.dataset.chat));document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>done(b.dataset.done));document.querySelectorAll('[data-offer]').forEach(b=>b.onclick=()=>offer(b.dataset.offer));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>del(b.dataset.delete));document.querySelectorAll('[data-block]').forEach(b=>b.onclick=()=>block(b.dataset.block))}
function volunteer(){clear();$('app').innerHTML=nav()+`<main class="wrap"><div class="head"><div><span class="badge">VOLUNTEER MODE</span><h2>Find People to Help</h2></div></div><section class="card"><div class="group"><label>Search</label><input id="search" placeholder="Title, category or location"></div></section><div class="grid"><section class="card"><h3>🌍 Open Requests</h3><div id="open"><div class="empty">Loading...</div></div></section><section class="card"><h3>📌 My Tasks</h3><div id="tasks"><div class="empty">Loading...</div></div></section></div><section class="card hidden" id="chat"><h3>💬 Chat</h3><div id="chatbox"></div></section></main>`;let off=onValue(ref(db,'helpRequests'),s=>renderVol(s.val()||{}));offs.push(off);$('search').oninput=()=>renderVol(window.requests||{})}
function renderVol(data){window.requests=data;let q=($('search')?.value||'').toLowerCase(),a=Object.values(data);let open=a.filter(r=>r.status==='open'&&r.createdBy!==user.uid&&(r.title+' '+r.category+' '+r.location).toLowerCase().includes(q)),mine=a.filter(r=>r.volunteerId===user.uid);$('open').innerHTML=open.length?open.map(r=>`<div class="request"><div class="rhead"><div><h4>${esc(r.title)}</h4><div class="meta">${esc(r.category)} • ${esc(r.location)} • ${esc(r.urgency)}</div></div><span class="status open">OPEN</span></div><div class="desc">${esc(r.description)}</div><div class="meta">Requested by ${esc(r.requesterName)}</div><div class="actions"><button class="btn primary" data-offer="${r.requestId}">Offer Help</button></div></div>`).join(''):'<div class="empty">No open requests.</div>';$('tasks').innerHTML=mine.length?mine.map(r=>`<div class="request"><div class="rhead"><h4>${esc(r.title)}</h4><span class="status ${r.status}">${esc(r.status)}</span></div><div class="meta">Requester: ${esc(r.requesterName)} • ${esc(r.location)}</div><div class="actions">${r.status==='assigned'?`<button class="btn primary" data-chat="${r.requestId}">Chat</button><button class="btn success" data-done="${r.requestId}">Completed</button>`:''}</div></div>`).join(''):'<div class="empty">No assigned tasks.</div>';bindButtons()}
async function offer(id){let m=prompt('Message to requester:');if(m===null)return;await set(ref(db,'offers/'+id+'/'+user.uid),{volunteerId:user.uid,volunteerName:profile.name,message:m||'I can help with this request.',status:'pending',createdAt:Date.now()});alert('Offer sent!')}
function chat(id){$('chat').classList.remove('hidden');$('chatbox').innerHTML=`<div class="chat"><div class="messages" id="msgs"></div><div class="send"><input id="msg" placeholder="Type a message..."><button class="btn primary" id="send">Send</button></div></div>`;$('send').onclick=()=>send(id);$('msg').onkeydown=e=>{if(e.key==='Enter')send(id)};let off=onValue(ref(db,'chats/'+id),s=>{let a=Object.values(s.val()||{}).sort((x,y)=>x.timestamp-y.timestamp);$('msgs').innerHTML=a.length?a.map(m=>`<div class="msg ${m.senderId===user.uid?'mine':''}"><b>${esc(m.senderName)}</b><div>${esc(m.message)}</div><small>${time(m.timestamp)}</small></div>`).join(''):'<div class="empty">Start the conversation.</div>';$('msgs').scrollTop=$('msgs').scrollHeight});offs.push(off)}
async function send(id){let m=$('msg').value.trim();if(!m)return;let k=push(ref(db,'chats/'+id)).key;await set(ref(db,'chats/'+id+'/'+k),{senderId:user.uid,senderName:profile.name,message:m,timestamp:Date.now()});$('msg').value=''}
function admin(){clear();$('app').innerHTML=nav()+`<main class="wrap"><div class="head"><div><span class="badge">ADMIN</span><h2>Control Panel</h2></div></div><div class="stats"><div class="stat"><small>Users</small><strong id="au">0</strong></div><div class="stat"><small>Volunteers</small><strong id="av">0</strong></div><div class="stat"><small>Requests</small><strong id="ar">0</strong></div><div class="stat"><small>Completed</small><strong id="ad">0</strong></div></div><section class="card"><h3>👥 Users</h3><div class="tablewrap"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Mode</th><th>Status</th><th>Action</th></tr></thead><tbody id="ut"></tbody></table></div></section><section class="card"><h3>📋 Requests</h3><div id="rtab"></div></section></main>`;let uo=onValue(ref(db,'users'),s=>{let a=Object.values(s.val()||{});$('au').textContent=a.length;$('av').textContent=a.filter(x=>x.mode==='volunteer').length;$('ut').innerHTML=a.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${esc(x.role)}</td><td>${esc(x.mode||'help')}</td><td>${esc(x.status||'active')}</td><td>${x.uid===user.uid?'—':`<button class="btn ${x.status==='blocked'?'success':'danger'}" data-block="${x.uid}">${x.status==='blocked'?'Unblock':'Block'}</button>`}</td></tr>`).join('');document.querySelectorAll('[data-block]').forEach(b=>b.onclick=()=>block(b.dataset.block))});let ro=onValue(ref(db,'helpRequests'),s=>{let a=Object.values(s.val()||{});$('ar').textContent=a.length;$('ad').textContent=a.filter(x=>x.status==='completed').length;$('rtab').innerHTML=a.map(r=>`<div class="request"><div class="rhead"><h4>${esc(r.title)}</h4><span class="status ${r.status}">${esc(r.status)}</span></div><div class="meta">${esc(r.requesterName)} • ${esc(r.location)}</div><div class="desc">${esc(r.description)}</div><button class="btn danger" data-delete="${r.requestId}">Delete</button></div>`).join('')||'<div class="empty">No requests.</div>';document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>del(b.dataset.delete))});offs.push(uo,ro)}
async function block(uid){let s=await get(ref(db,'users/'+uid)),x=s.val();await update(ref(db,'users/'+uid),{status:x.status==='blocked'?'active':'blocked'})}async function del(id){if(confirm('Delete this request?'))await remove(ref(db,'helpRequests/'+id))}
landing();
</script></body></html>
